# ── Server ────────────────────────────────────────────────────────────────
server.port=8090
spring.application.name=zenith-retail-system

# ── Database ──────────────────────────────────────────────────────────────
# Replace these with your own MySQL credentials before running
spring.datasource.url=jdbc:mysql://localhost:3306/smartpos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── File Uploads ──────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Mail ──────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── JWT ───────────────────────────────────────────────────────────────────
jwt.secret=SmartPOS2026SecretKeyForJWTTokensUOS
jwt.expiration=86400000

# ── Dev: disable static resource caching ─────────────────────────────────
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
