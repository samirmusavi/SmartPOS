<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – SmartPOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="/css/smartpos.css"/>
    <style>
        .auth-tabs {
            display: flex;
            gap: 0;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: var(--space-6);
        }
        .auth-tab {
            flex: 1;
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .auth-tab.active {
            background: var(--surface-1);
            color: var(--text-primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .auth-panel { display: none; }
        .auth-panel.active { display: block; }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <!-- Brand -->
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="fas fa-store"></i>
            </div>
            <div class="auth-title">SmartPOS</div>
            <div class="auth-subtitle">
                Intelligent Retail Management System
            </div>
        </div>

        <!-- Box -->
        <div class="auth-box">

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-i18n="auth_signin" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" data-i18n="auth_register" onclick="switchTab('register')">Register Business</button>
            </div>

            <!-- LOGIN PANEL -->
            <div class="auth-panel active" id="panelLogin">
                <div class="auth-box-title" data-i18n="auth_welcome">Welcome back</div>
                <div class="auth-box-sub" data-i18n="auth_welcome_sub">Sign in to access your business portal</div>

                <div id="loginAlert"
                     style="display:none"
                     class="alert alert-error mb-4"></div>

                <div class="flex flex-col gap-4">

                    <div class="form-group">
                        <label class="form-label" data-i18n="auth_email">Email Address</label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="loginEmail"
                                   class="form-control"
                                   placeholder="your@email.com"
                                   autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-i18n="auth_password">Password</label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="loginPassword"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   autocomplete="current-password">
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg" id="loginBtn" onclick="login()">
                        <i class="fas fa-sign-in-alt"></i> <span data-i18n="auth_login_btn">Sign In</span>
                    </button>

                    <div style="text-align:center;margin-top:4px">
                        <a href="/forgot-password.html"
                           style="font-size:13px;color:var(--text-muted);text-decoration:none;"
                           onmouseover="this.style.color='var(--accent)'"
                           onmouseout="this.style.color='var(--text-muted)'"
                           data-i18n="auth_forgot_password">Forgot password?</a>
                    </div>

                </div>

                <div style="text-align:center;margin-top:var(--space-5)">
                    <span class="text-xs text-muted" data-i18n="auth_no_account">Don't have an account?</span>
                    <button class="btn btn-ghost btn-sm"
                            onclick="switchTab('register')"
                            style="font-size:var(--text-xs)">
                        Register Business
                    </button>
                </div>
            </div>

            <!-- REGISTER PANEL -->
            <div class="auth-panel" id="panelRegister">
                <div class="auth-box-title" data-i18n="auth_trial_title">Start your free trial</div>
                <div class="auth-box-sub" data-i18n="auth_trial_sub">
                    14 days free — no credit card required
                </div>

                <div id="registerAlert"
                     style="display:none"
                     class="alert alert-error mb-4"></div>

                <div class="flex flex-col gap-4">

                    <div style="background:var(--surface-2);
                                border:1px solid var(--border);
                                border-radius:var(--radius-md);
                                padding:var(--space-4)">
                        <div class="text-xs font-semibold text-muted uppercase tracking"
                             style="margin-bottom:12px"
                             data-i18n="auth_biz_info">
                            <i class="fas fa-building"
                               style="margin-right:6px"></i>
                            Business Information
                        </div>
                        <div class="flex flex-col gap-3">
                            <div class="form-group">
                                <label class="form-label" data-i18n="auth_biz_name">Business Name *</label>
                                <input type="text" id="regBusinessName"
                                       data-i18n="auth_biz_name"
                                       class="form-control"
                                       placeholder="e.g. Al Noor Perfumes">
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label class="form-label" data-i18n="auth_owner_name">Owner Name *</label>
                                    <input type="text" id="regOwnerName"
                                           data-i18n="auth_owner_name"
                                           class="form-control"
                                           placeholder="Your full name">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="auth_phone">Phone *</label>
                                    <input type="text" id="regPhone"
                                           data-i18n="auth_phone"
                                           class="form-control"
                                           placeholder="+971501234567">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" data-i18n="auth_biz_email">Business Email *</label>
                                <input type="email" id="regBusinessEmail"
                                       data-i18n="auth_biz_email"
                                       class="form-control"
                                       placeholder="business@company.ae">
                            </div>
                        </div>
                    </div>

                    <div style="background:var(--surface-2);
                                border:1px solid var(--border);
                                border-radius:var(--radius-md);
                                padding:var(--space-4)">
                        <div class="text-xs font-semibold text-muted uppercase tracking"
                             style="margin-bottom:12px"
                             data-i18n="auth_login_creds">
                            <i class="fas fa-user-shield"
                               style="margin-right:6px"></i>
                            Your Login Credentials
                        </div>
                        <div class="flex flex-col gap-3">
                            <div class="form-group">
                                <label class="form-label" data-i18n="auth_login_email">Login Email *</label>
                                <input type="email" id="regEmail"
                                       data-i18n="auth_login_email"
                                       class="form-control"
                                       placeholder="you@company.ae">
                            </div>
                            <div class="form-group">
                                <label class="form-label" data-i18n="auth_password">Password *</label>
                                <input type="password" id="regPassword"
                                       data-i18n="auth_password"
                                       class="form-control"
                                       placeholder="Min 8 characters">
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg"
                            id="registerBtn" onclick="register()">
                        <i class="fas fa-rocket"></i>
                        Create Account
                    </button>

                </div>

                <div style="text-align:center;margin-top:var(--space-4)">
                    <span class="text-xs text-muted">
                        Already have an account?
                    </span>
                    <button class="btn btn-ghost btn-sm"
                            onclick="switchTab('login')"
                            style="font-size:var(--text-xs)">
                        Sign in
                    </button>
                </div>
            </div>

        </div>

        <!-- Plan badges -->
        <div style="display:flex;justify-content:center;
                    gap:var(--space-2);margin-top:var(--space-5)">
            <span class="badge badge-basic">Basic</span>
            <span class="badge badge-business">Business</span>
            <span class="badge badge-enterprise">Enterprise</span>
        </div>

    </div>
</div>

<script src="/js/smartpos.js"></script>
<script>

    // Already logged in — go to branch selection
    if (Auth.isClient()) {
        window.location.href = '/branch-select.html';
    }

    // Tab switching
    function switchTab(tab) {
        document.querySelectorAll('.auth-tab')
            .forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-panel')
            .forEach(p => p.classList.remove('active'));

        if (tab === 'login') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            document.getElementById('panelLogin').classList.add('active');
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            document.getElementById('panelRegister').classList.add('active');
        }
    }

    // Login
    async function login() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn      = document.getElementById('loginBtn');
        const alert    = document.getElementById('loginAlert');

        alert.style.display = 'none';

        if (!email || !password) {
            showAlert('loginAlert', 'Please enter your email and password.');
            return;
        }

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
        btn.disabled  = true;

        try {
            const data = await API.post('/api/auth/login', { email, password });
            Auth.setClient(data);

            // Always go to branch selection after login.
            // branch-select.html handles:
            //   - Single branch users → auto-redirects to dashboard
            //   - Multi-branch users  → shows branch picker
            //   - OWNER               → shows branch picker + "All Branches" option
            window.location.href = '/branch-select.html';

        } catch (err) {
            showAlert('loginAlert', err.message || 'Invalid email or password.');
        } finally {
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            btn.disabled  = false;
        }
    }

    // Register
    async function register() {
        const businessName  = document.getElementById('regBusinessName').value.trim();
        const ownerName     = document.getElementById('regOwnerName').value.trim();
        const phone         = document.getElementById('regPhone').value.trim();
        const businessEmail = document.getElementById('regBusinessEmail').value.trim();
        const email         = document.getElementById('regEmail').value.trim();
        const password      = document.getElementById('regPassword').value;

        if (!businessName || !ownerName || !phone ||
            !businessEmail || !email || !password) {
            showAlert('registerAlert', 'Please fill in all required fields.');
            return;
        }

        if (password.length < 8) {
            showAlert('registerAlert', 'Password must be at least 8 characters.');
            return;
        }

        const btn = document.getElementById('registerBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
        btn.disabled  = true;

        try {
            await API.post('/api/auth/register', {
                businessName, ownerName, phone,
                businessEmail, email, password
            });
            showSuccess('registerAlert', 'Account created! You can now sign in.');
            setTimeout(() => switchTab('login'), 2000);
        } catch (err) {
            showAlert('registerAlert', err.message || 'Failed to create account.');
        } finally {
            btn.innerHTML = '<i class="fas fa-rocket"></i> Create Account';
            btn.disabled  = false;
        }
    }

    function showAlert(id, msg) {
        const el = document.getElementById(id);
        el.innerHTML  = `<i class="fas fa-exclamation-circle"></i> &nbsp;${msg}`;
        el.className  = 'alert alert-error mb-4';
        el.style.display = 'flex';
    }

    function showSuccess(id, msg) {
        const el = document.getElementById(id);
        el.innerHTML  = `<i class="fas fa-check-circle"></i> &nbsp;${msg}`;
        el.className  = 'alert alert-success mb-4';
        el.style.display = 'flex';
    }

    // Enter key support
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const loginActive = document.getElementById('panelLogin')
                .classList.contains('active');
            if (loginActive) login(); else register();
        }
    });

</script>
</body>
</html>
