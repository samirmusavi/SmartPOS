<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password – SmartPOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="/css/smartpos.css"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-0);
            padding: var(--space-6);
        }
        .auth-card {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-8);
            width: 100%;
            max-width: 420px;
        }
        .auth-logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
            justify-content: center;
        }
        .auth-logo-icon {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px;
        }
        .auth-logo-name {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
        }
        .auth-title {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            text-align: center;
        }
        .auth-sub {
            font-size: var(--text-sm);
            color: var(--text-muted);
            text-align: center;
            margin-bottom: var(--space-6);
            line-height: 1.5;
        }
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            margin-top: var(--space-5);
            font-size: var(--text-sm);
            color: var(--text-muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--accent); }

        /* Success state */
        .success-icon {
            width: 64px; height: 64px;
            background: rgba(16,185,129,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto var(--space-5);
            font-size: 28px;
            color: #10b981;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon"><i class="fas fa-store"></i></div>
        <span class="auth-logo-name">SmartPOS</span>
    </div>

    <!-- Request form -->
    <div id="requestView">
        <div class="auth-title">Forgot your password?</div>
        <div class="auth-sub">Enter your email address and we'll send you a link to reset your password.</div>

        <div id="alertBox" class="alert alert-error mb-4" style="display:none"></div>

        <div class="flex flex-col gap-4">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="emailInput" class="form-control"
                           placeholder="your@email.com" autocomplete="email">
                </div>
            </div>

            <button class="btn btn-primary btn-lg" id="submitBtn" onclick="requestReset()">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </div>
    </div>

    <!-- Success state -->
    <div id="successView" style="display:none; text-align:center">
        <div class="success-icon"><i class="fas fa-envelope-circle-check"></i></div>
        <div class="auth-title">Check your inbox</div>
        <div class="auth-sub">
            If an account with that email exists, we've sent a password reset link.<br>
            The link expires in <strong>30 minutes</strong>.
        </div>
        <div class="auth-sub" style="font-size:12px; margin-top: -8px">
            Don't see it? Check your spam folder.
        </div>
    </div>

    <a href="/login.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Sign In
    </a>
</div>

<script src="/js/smartpos.js"></script>
<script>
    async function requestReset() {
        const email = document.getElementById('emailInput').value.trim();
        const btn   = document.getElementById('submitBtn');
        const alert = document.getElementById('alertBox');

        alert.style.display = 'none';

        if (!email) {
            alert.textContent = 'Please enter your email address.';
            alert.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        try {
            await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            // Always show success regardless of response — security
            document.getElementById('requestView').style.display = 'none';
            document.getElementById('successView').style.display = 'block';
        } catch (e) {
            // Even on network error, show success to avoid enumeration
            document.getElementById('requestView').style.display = 'none';
            document.getElementById('successView').style.display = 'block';
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') requestReset();
    });
</script>
</body>
</html>
