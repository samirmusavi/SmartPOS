<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password – SmartPOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="/css/smartpos.css"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-0);
            padding: var(--space-6);
        }
        .auth-card {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-8);
            width: 100%;
            max-width: 420px;
        }
        .auth-logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
            justify-content: center;
        }
        .auth-logo-icon {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px;
        }
        .auth-logo-name {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
        }
        .auth-title {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            text-align: center;
        }
        .auth-sub {
            font-size: var(--text-sm);
            color: var(--text-muted);
            text-align: center;
            margin-bottom: var(--space-6);
            line-height: 1.5;
        }
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            margin-top: var(--space-5);
            font-size: var(--text-sm);
            color: var(--text-muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--accent); }
        .success-icon {
            width: 64px; height: 64px;
            background: rgba(16,185,129,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto var(--space-5);
            font-size: 28px;
            color: #10b981;
        }
        .error-icon {
            width: 64px; height: 64px;
            background: rgba(239,68,68,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto var(--space-5);
            font-size: 28px;
            color: #ef4444;
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            margin-top: 6px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }
        .strength-label {
            font-size: 11px;
            margin-top: 4px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon"><i class="fas fa-store"></i></div>
        <span class="auth-logo-name">SmartPOS</span>
    </div>

    <!-- Invalid token state (shown if no token in URL) -->
    <div id="invalidView" style="display:none; text-align:center">
        <div class="error-icon"><i class="fas fa-link-slash"></i></div>
        <div class="auth-title">Invalid link</div>
        <div class="auth-sub">This password reset link is missing or invalid. Please request a new one.</div>
        <a href="/forgot-password.html" class="btn btn-primary btn-lg" style="display:block; margin-top: var(--space-4)">
            <i class="fas fa-paper-plane"></i> Request New Link
        </a>
    </div>

    <!-- Reset form -->
    <div id="resetView" style="display:none">
        <div class="auth-title">Set a new password</div>
        <div class="auth-sub">Choose a strong password — at least 8 characters.</div>

        <div id="alertBox" class="alert alert-error mb-4" style="display:none"></div>

        <div class="flex flex-col gap-4">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="newPassword" class="form-control"
                           placeholder="Min 8 characters" autocomplete="new-password"
                           oninput="checkStrength(this.value)">
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" class="form-control"
                           placeholder="Repeat your password" autocomplete="new-password">
                </div>
            </div>

            <button class="btn btn-primary btn-lg" id="submitBtn" onclick="doReset()">
                <i class="fas fa-key"></i> Reset Password
            </button>
        </div>
    </div>

    <!-- Success state -->
    <div id="successView" style="display:none; text-align:center">
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <div class="auth-title">Password updated!</div>
        <div class="auth-sub">Your password has been changed successfully. You can now sign in.</div>
        <a href="/login.html" class="btn btn-primary btn-lg" style="display:block; margin-top: var(--space-4)">
            <i class="fas fa-sign-in-alt"></i> Go to Sign In
        </a>
    </div>

    <a href="/login.html" class="back-link" id="backLink">
        <i class="fas fa-arrow-left"></i> Back to Sign In
    </a>
</div>

<script src="/js/smartpos.js"></script>
<script>
    // Extract token from URL query string
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token || token.trim() === '') {
        document.getElementById('invalidView').style.display = 'block';
    } else {
        document.getElementById('resetView').style.display = 'block';
    }

    function checkStrength(val) {
        const fill  = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        if (!val) { fill.style.width = '0%'; label.textContent = ''; return; }

        let score = 0;
        if (val.length >= 8)  score++;
        if (val.length >= 12) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const levels = [
            { pct: '20%', color: '#ef4444', text: 'Very weak' },
            { pct: '40%', color: '#f97316', text: 'Weak' },
            { pct: '60%', color: '#eab308', text: 'Fair' },
            { pct: '80%', color: '#22c55e', text: 'Strong' },
            { pct: '100%', color: '#10b981', text: 'Very strong' },
        ];
        const lvl = levels[Math.min(score, 4)];
        fill.style.width      = lvl.pct;
        fill.style.background = lvl.color;
        label.textContent     = lvl.text;
        label.style.color     = lvl.color;
    }

    async function doReset() {
        const newPassword     = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn             = document.getElementById('submitBtn');
        const alertBox        = document.getElementById('alertBox');

        alertBox.style.display = 'none';

        if (!newPassword || newPassword.length < 8) {
            showError('Password must be at least 8 characters.');
            return;
        }
        if (newPassword !== confirmPassword) {
            showError('Passwords do not match.');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                throw new Error(data.message || 'Failed to reset password.');
            }

            document.getElementById('resetView').style.display  = 'none';
            document.getElementById('successView').style.display = 'block';
            document.getElementById('backLink').style.display    = 'none';

        } catch (e) {
            showError(e.message || 'Something went wrong. Please request a new link.');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
        }
    }

    function showError(msg) {
        const box = document.getElementById('alertBox');
        box.textContent    = msg;
        box.style.display  = 'block';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && document.getElementById('resetView').style.display !== 'none') {
            doReset();
        }
    });
</script>
</body>
</html>
